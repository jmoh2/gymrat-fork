<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>
    <link rel="stylesheet" href="css/workout.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="analytics-page">
    <div class="header-bar">
        <button class="button" onclick="goHome()">Back</button>
        <img src="./logos/GymRat.png" class="header-logo" alt="GymRat Logo">
        <div></div>
    </div>
    <script>
    function goHome() {
        window.location.href = '/basepage';
    }
    </script>

    <h1 class="user-message">Analytics</h1>

    <main class="analytics-grid">
        <section class="chart-card analytics-chart-card">
            <div class="analytics-card-header">
                <div>
                    <h3>Workout Calories Burned</h3>
                    <p>Calories burned from each logged workout.</p>
                </div>
                <select class="time-filter" data-chart-target="workouts">
                    <option value="day">By Day</option>
                    <option value="week">By Week</option>
                    <option value="month">By Month</option>
                    <option value="year">By Year</option>
                </select>
                <div class="chart-controls">
                    <button class="chart-button active-chart-button" type="button" data-chart-target="workouts" data-chart-type="bar">Bar</button>
                    <button class="chart-button" type="button" data-chart-target="workouts" data-chart-type="line">Line</button>
                </div>
            </div>
            <div class="chart-area">
                <canvas id="workoutAnalyticsChart"></canvas>
            </div>
            <p id="workoutAnalyticsStatus" class="analytics-status"></p>
        </section>

        <section class="chart-card analytics-chart-card">
            <div class="analytics-card-header">
                <div>
                    <h3>Meal Calories Consumed</h3>
                    <p>Calories consumed from each logged meal.</p>
                </div>
                <select class="time-filter" data-chart-target="meals">
                    <option value="day">By Day</option>
                    <option value="week">By Week</option>
                    <option value="month">By Month</option>
                    <option value="year">By Year</option>
                </select>
                <div class="chart-controls">
                    <button class="chart-button active-chart-button" type="button" data-chart-target="meals" data-chart-type="bar">Bar</button>
                    <button class="chart-button" type="button" data-chart-target="meals" data-chart-type="line">Line</button>
                </div>
            </div>
            <div class="chart-area">
                <canvas id="mealAnalyticsChart"></canvas>
            </div>
            <p id="mealAnalyticsStatus" class="analytics-status"></p>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/analytics.js"></script>
</body>
</html>
